name: Bug report
description: Tell us what broke and how to reproduce it.
labels: ["type:bug", "status:new"]
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Leave out account details, private feed links, recordings, and credentials.
        For private support, visit https://drift.lab44.dev/privacy.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps. If it only happens sometimes, say so.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Find these under settings → about & support.
  - type: input
    id: device
    attributes:
      label: Device model and iOS version
      description: Do not include serial numbers or account information.
  - type: checkboxes
    id: public
    attributes:
      label: Public report
      options:
        - label: I understand this report is public and have left out sensitive information.
          required: true
